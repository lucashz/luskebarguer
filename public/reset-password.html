<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/assets/tapronto-favicon.svg">
    <title>Redefinir Senha - TáPronto</title>
    <link rel="stylesheet" href="/styles.css?v=20260708-qa-flow">
  </head>
  <body class="portal-page login-page">
    <header class="portal-topbar">
      <a class="portal-brand" href="/"><img src="/assets/tapronto-logo-horizontal.png" alt="TáPronto" width="300" height="100"></a>
      <nav><a href="https://app.taprontomenu.com.br/">Entrar</a></nav>
    </header>

    <main class="login-shell">
      <section class="login-copy">
        <p class="eyebrow">Recuperação de acesso</p>
        <h1>Crie uma nova senha para voltar ao painel.</h1>
        <p id="resetIntro">Validando link de recuperação...</p>
      </section>

      <section class="signup-card login-card">
        <form id="portalResetPasswordForm" class="stack-form">
          <h2>Redefinir senha</h2>
          <label>E-mail<input name="email" id="resetEmail" disabled autocomplete="email"></label>
          <label>Nova senha<input name="password" required type="password" minlength="8" autocomplete="new-password"></label>
          <label>Confirmar senha<input name="confirm_password" required type="password" minlength="8" autocomplete="new-password"></label>
          <button class="portal-button" id="portalResetPasswordButton">Salvar nova senha</button>
          <p id="portalResetPasswordMessage" class="form-message"></p>
        </form>
      </section>
    </main>

    <script src="/portal.js?v=20260723-password-reset" type="module"></script>
  </body>
</html>
