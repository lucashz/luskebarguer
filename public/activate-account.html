<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/assets/tapronto-mark-2026.png?v=20260921">
    <title>Ativar Conta - TáPronto</title>
    <link rel="stylesheet" href="/styles.css?v=20260708-qa-flow">
  </head>
  <body class="portal-page signup-page">
    <header class="portal-topbar">
      <a class="portal-brand" href="/"><img src="/assets/tapronto-logo-2026.png?v=20260921" alt="TáPronto" width="420" height="100"></a>
      <nav>
        <a href="https://app.taprontomenu.com.br/">Entrar</a>
      </nav>
    </header>

    <main class="signup-shell compact-auth-shell">
      <section class="signup-intro">
        <p class="eyebrow">Ativação</p>
        <h1>Confirme Seu E-mail.</h1>
        <p>Essa etapa protege a plataforma contra spam e garante que você tenha acesso ao e-mail principal da loja.</p>
      </section>

      <section class="signup-card portal-auth-card">
        <p class="eyebrow">Conta TáPronto</p>
        <h2>Ativar Acesso</h2>
        <p class="muted" id="activationIntro">Validando link de ativação...</p>
        <p id="portalActivationMessage"></p>
        <div id="assistedActivationPassword" hidden>
          <label class="signup-field">Crie sua senha
            <input id="activationPassword" type="password" minlength="8" maxlength="72" autocomplete="new-password">
          </label>
          <label class="signup-field">Confirme sua senha
            <input id="activationPasswordConfirm" type="password" minlength="8" maxlength="72" autocomplete="new-password">
          </label>
          <p class="muted">Seus 7 dias grátis começam depois que você criar a senha.</p>
        </div>
        <div class="signup-submit-row">
          <a class="ghost-button compact" href="https://app.taprontomenu.com.br/">Voltar ao Login</a>
          <button class="portal-button" id="portalActivationButton" type="button" disabled>Ativar e entrar</button>
        </div>
      </section>
    </main>

    <script src="/portal.js?v=20260724-account-activation" type="module"></script>
  </body>
</html>
