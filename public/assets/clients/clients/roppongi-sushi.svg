<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="rp-grad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="94" fill="url(#rp-grad)" stroke="#e11d48" stroke-width="4"/>
  
  <!-- Japanese Minimalist Kamon (Red Sun & Geometric Crest) -->
  <g transform="translate(100, 68)">
    <circle cx="0" cy="0" r="30" fill="#e11d48"/>
    <!-- Torii Gate Vector Geometry -->
    <path d="M-22 -14 L22 -14 L20 -10 L-20 -10 Z" fill="#ffffff"/>
    <path d="M-18 -8 L18 -8 L16 -5 L-16 -5 Z" fill="#ffffff"/>
    <rect x="-12" y="-5" width="4" height="26" fill="#ffffff"/>
    <rect x="8" y="-5" width="4" height="26" fill="#ffffff"/>
  </g>

  <!-- Typography -->
  <text x="100" y="130" font-family="'Montserrat', sans-serif" font-size="16.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3.5">ROPPONGI</text>
  
  <text x="100" y="148" font-family="'Montserrat', sans-serif" font-size="9" font-weight="800" fill="#e11d48" text-anchor="middle" letter-spacing="4">SUSHI HOUSE</text>
  
  <!-- Japanese Kanji -->
  <text x="100" y="168" font-family="'Noto Sans JP', sans-serif" font-size="9" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="4">六本木 • CAMPO GRANDE</text>
</svg>