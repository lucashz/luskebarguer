<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bz-grad" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="94" fill="url(#bz-grad)" stroke="#dc2626" stroke-width="4"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
  
  <!-- Geometric Monogram Crest -->
  <g transform="translate(100, 64)">
    <polygon points="0,-28 26,-12 26,18 0,32 -26,18 -26,-12" fill="#dc2626"/>
    <text x="0" y="10" font-family="'Impact', 'Arial Black', sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">B</text>
  </g>

  <!-- Wordmark -->
  <text x="100" y="126" font-family="'Impact', 'Arial Black', sans-serif" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">BIZZO</text>
  
  <!-- Italian Flag Bar -->
  <g transform="translate(73, 136)">
    <rect x="0" y="0" width="18" height="4" fill="#16a34a"/>
    <rect x="18" y="0" width="18" height="4" fill="#ffffff"/>
    <rect x="36" y="0" width="18" height="4" fill="#dc2626"/>
  </g>

  <text x="100" y="156" font-family="'Montserrat', sans-serif" font-size="8.5" font-weight="900" fill="#ef4444" text-anchor="middle" letter-spacing="2">PIZZA &amp; PARRILLA</text>
  <text x="100" y="170" font-family="'Montserrat', sans-serif" font-size="6.5" font-weight="700" fill="#a1a1aa" text-anchor="middle" letter-spacing="2">LAGOA VERMELHA • RS</text>
</svg>