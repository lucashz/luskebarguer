<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="Tela do painel administrativo na aba de operacao">
  <defs>
    <style>
      .font { font-family: Inter, Arial, sans-serif; }
      .label { font-size: 16px; font-weight: 900; letter-spacing: 1.8px; fill: #e11d2a; }
      .nav { font-size: 18px; font-weight: 850; fill: #3f4654; }
      .muted { fill: #667085; }
      .title { fill: #111827; font-weight: 900; }
      .card { fill: #fff; stroke: #dde3ea; stroke-width: 1.2; }
      .btn { fill: #fff; stroke: #dfe3ea; stroke-width: 1.2; }
      .red { fill: #e9252f; }
      .green { fill: #16a34a; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#f3f4f6"/>

  <g>
    <rect width="240" height="1080" fill="#ffffff"/>
    <text x="24" y="54" class="font" font-size="19" font-weight="900" fill="#e11d2a">Cardápio</text>
    <g class="font nav">
      <rect x="22" y="104" width="196" height="48" rx="9" fill="#fde2e2"/>
      <text x="36" y="134" fill="#e11d2a">Operação</text>
      <text x="36" y="196">Pedidos</text>
      <text x="36" y="256">Cardápio</text>
      <text x="36" y="316">Relatórios</text>
      <text x="36" y="376">Mesas</text>
      <text x="36" y="436">Clientes</text>
      <text x="36" y="496">Cupons e Campanhas</text>
      <text x="36" y="556">Configurações da Loja</text>
      <text x="36" y="616">Integrações</text>
      <text x="36" y="676">Plano</text>
      <text x="36" y="736">Suporte</text>
      <text x="36" y="796">Conta e usuários</text>
    </g>
  </g>

  <g>
    <text x="286" y="46" class="font label">ADMINISTRADOR DEMO - ADMIN@CARDAPIO.LOCAL</text>
    <text x="286" y="92" class="font title" font-size="48">Operação</text>
    <rect x="1852" y="44" width="54" height="40" rx="8" fill="#ffffff" stroke="#dfe3ea"/>
    <text x="1865" y="69" class="font" font-size="14" font-weight="850" fill="#111827">Sair</text>

    <rect x="286" y="122" width="1618" height="136" rx="10" fill="#effdf4" stroke="#9ee6b8"/>
    <text x="310" y="162" class="font label" fill="#047857">CONTROLE DA LOJA</text>
    <text x="310" y="202" class="font title" font-size="30">Loja online e recebendo pedidos</text>
    <text x="310" y="234" class="font" font-size="18" fill="#047857">Clientes podem montar a sacola e enviar pedidos pelo WhatsApp da loja.</text>
    <rect x="1800" y="168" width="82" height="46" rx="23" class="green"/>
    <text x="1818" y="197" class="font" font-size="17" font-weight="900" fill="#ffffff">Aberta</text>

    <g>
      <rect x="286" y="278" width="826" height="176" rx="10" class="card"/>
      <text x="310" y="322" class="font title" font-size="19">Iniciar operação</text>
      <text x="310" y="356" class="font" font-size="18" fill="#6b7280">Zera a fila atual, arquiva os pedidos anteriores e deixa a loja online para novos pedidos.</text>
      <rect x="310" y="384" width="778" height="48" rx="8" fill="#ee8086"/>
      <text x="635" y="414" class="font" font-size="17" font-weight="900" fill="#ffffff">Iniciar operação</text>
    </g>

    <g>
      <rect x="1128" y="278" width="776" height="176" rx="10" fill="#fff7f7" stroke="#f7b3b7"/>
      <text x="1152" y="322" class="font title" font-size="19">Parar operação</text>
      <text x="1152" y="356" class="font" font-size="18" fill="#6b7280">Deixa a loja offline, bloqueia novos pedidos e mostra aviso de loja fechada para o cliente.</text>
      <rect x="1152" y="384" width="728" height="48" rx="8" class="red"/>
      <text x="1474" y="414" class="font" font-size="17" font-weight="900" fill="#ffffff">Parar operação</text>
    </g>

    <g>
      <rect x="286" y="476" width="410" height="132" rx="9" class="card"/>
      <text x="306" y="518" class="font" font-size="18" fill="#6b7280">Faturamento hoje</text>
      <text x="306" y="558" class="font title" font-size="30">R$ 0,00</text>
      <text x="306" y="590" class="font" font-size="16" fill="#6b7280">0 pedido(s) hoje, 0 em aberto.</text>

      <rect x="712" y="476" width="410" height="132" rx="9" class="card"/>
      <text x="732" y="518" class="font" font-size="18" fill="#6b7280">Produtos ativos</text>
      <text x="732" y="558" class="font title" font-size="30">14</text>
      <text x="732" y="590" class="font" font-size="16" fill="#6b7280">5 categoria(s) cadastrada(s).</text>

      <rect x="1138" y="476" width="410" height="132" rx="9" class="card"/>
      <text x="1158" y="518" class="font" font-size="18" fill="#6b7280">Mesas ativas</text>
      <text x="1158" y="558" class="font title" font-size="30">0</text>
      <text x="1158" y="590" class="font" font-size="16" fill="#6b7280">0 comanda(s) aberta(s).</text>

      <rect x="1564" y="476" width="340" height="132" rx="9" class="card"/>
      <text x="1584" y="518" class="font" font-size="18" fill="#6b7280">Plano atual</text>
      <text x="1584" y="558" class="font title" font-size="30">Premium</text>
      <text x="1584" y="590" class="font" font-size="16" fill="#6b7280">Ativo</text>
    </g>

    <g>
      <rect x="286" y="630" width="1618" height="118" rx="9" class="card"/>
      <text x="310" y="668" class="font label">AÇÕES RÁPIDAS</text>
      <text x="310" y="698" class="font title" font-size="25">Próximos passos da operação</text>
      <text x="310" y="728" class="font" font-size="18" fill="#374151">Cadastre mesas para usar QR Code e comandas no salão.</text>
      <rect x="1482" y="670" width="110" height="40" rx="8" class="btn"/>
      <text x="1504" y="696" class="font" font-size="15" font-weight="850" fill="#111827">Ver pedidos</text>
      <rect x="1604" y="670" width="128" height="40" rx="8" class="btn"/>
      <text x="1622" y="696" class="font" font-size="15" font-weight="850" fill="#111827">Editar cardápio</text>
      <rect x="1744" y="670" width="64" height="40" rx="8" class="btn"/>
      <text x="1763" y="696" class="font" font-size="15" font-weight="850" fill="#111827">Mesas</text>
      <rect x="1820" y="670" width="72" height="40" rx="8" class="red"/>
      <text x="1835" y="696" class="font" font-size="15" font-weight="850" fill="#ffffff">Meu plano</text>
    </g>

    <g opacity=".24">
      <rect x="286" y="790" width="1618" height="1" fill="#cfd5df"/>
      <rect x="286" y="846" width="1250" height="1" fill="#dde2e9"/>
      <rect x="286" y="902" width="980" height="1" fill="#e1e5ec"/>
    </g>
  </g>
</svg>
