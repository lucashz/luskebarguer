server {
    listen 80;
    listen [::]:80;
    server_name guias.taprontomenu.com.br;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name guias.taprontomenu.com.br;

    ssl_certificate /etc/letsencrypt/live/taprontomenu.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taprontomenu.com.br/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TaprontoGuidesSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
