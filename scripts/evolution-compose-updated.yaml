services:
  postgres:
    image: postgres:15-alpine
    container_name: evolution_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=96MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME} -d ${POSTGRES_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    cpus: 0.50
    networks:
      - evolution

  redis:
    image: redis:7-alpine
    container_name: evolution_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 128m
    cpus: 0.25
    networks:
      - evolution

  api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HTTP_PROXY=http://192.168.1.100:8888
      - HTTPS_PROXY=http://192.168.1.100:8888
      - NO_PROXY=localhost,127.0.0.1,postgres,redis
    extra_hosts:
      - "web.whatsapp.com:57.144.179.32"
      - "g.whatsapp.net:57.144.179.33"
      - "v.whatsapp.net:57.144.179.32"
      - "mmg.whatsapp.net:57.144.179.32"
      - "static.whatsapp.net:57.144.179.32"
    ports:
      - "192.168.1.108:8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 768m
    cpus: 1.00
    networks:
      - evolution

volumes:
  postgres_data:
  redis_data:
  evolution_instances:

networks:
  evolution:
    name: evolution-lan
    driver: bridge
